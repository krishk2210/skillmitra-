<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login / Sign Up - Skill Mitra</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-fixed-variant": "#5c4300",
                    "error": "#ba1a1a",
                    "surface-container": "#f0eded",
                    "secondary": "#795900",
                    "outline-variant": "#c6c6cf",
                    "tertiary-fixed-dim": "#4edea3",
                    "on-primary-container": "#7984aa",
                    "on-secondary": "#ffffff",
                    "primary": "#00020e",
                    "on-background": "#1c1b1b",
                    "surface-dim": "#dcd9d9",
                    "secondary-container": "#fccb5c",
                    "on-primary-fixed": "#0e1a3b",
                    "surface-container-high": "#eae7e7",
                    "primary-fixed-dim": "#bac5ef",
                    "on-tertiary": "#ffffff",
                    "on-secondary-fixed": "#261a00",
                    "primary-container": "#0f1b3c",
                    "surface-container-low": "#f6f3f2",
                    "surface-container-highest": "#e5e2e1",
                    "inverse-surface": "#313030",
                    "on-primary": "#ffffff",
                    "on-primary-fixed-variant": "#3a4569",
                    "on-tertiary-fixed-variant": "#005236",
                    "primary-fixed": "#dbe1ff",
                    "on-surface": "#1c1b1b",
                    "surface-variant": "#e5e2e1",
                    "on-error-container": "#93000a",
                    "surface": "#fcf9f8",
                    "tertiary-fixed": "#6ffbbe",
                    "on-secondary-container": "#735500",
                    "inverse-on-surface": "#f3f0ef",
                    "tertiary": "#000301",
                    "background": "#fcf9f8",
                    "on-error": "#ffffff",
                    "inverse-primary": "#bac5ef",
                    "on-tertiary-fixed": "#002113",
                    "on-tertiary-container": "#009768",
                    "tertiary-container": "#002214",
                    "surface-tint": "#525d82",
                    "on-surface-variant": "#45464e",
                    "secondary-fixed": "#ffdf9f",
                    "error-container": "#ffdad6",
                    "outline": "#76767f",
                    "surface-bright": "#fcf9f8",
                    "secondary-fixed-dim": "#f0c052",
                    "surface-container-lowest": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-md": "16px",
                    "gutter": "24px",
                    "stack-sm": "8px",
                    "margin-desktop": "40px",
                    "stack-lg": "32px",
                    "container-max": "1280px",
                    "margin-mobile": "16px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Inter"],
                    "label-md": ["Inter"],
                    "headline-md": ["Inter"],
                    "display-lg": ["Inter"],
                    "body-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-lg": ["Inter"],
                    "label-sm": ["Inter"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
</head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col font-body-md">
<!-- Note: Top NavBar and Footer suppressed on linear/transactional screen -->
<main class="flex-grow flex w-full">
<div class="flex flex-col lg:flex-row w-full min-h-screen">
<!-- Left Side: Brand Panel (Hidden on mobile) -->
<div class="hidden lg:flex w-1/2 bg-primary-container text-on-primary-container flex-col justify-center items-center relative overflow-hidden">
<!-- Decorative Elements -->
<div class="absolute inset-0 bg-gradient-to-br from-primary/90 to-primary-container z-0"></div>
<div class="absolute inset-0 z-0 opacity-10 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
<!-- Content -->
<div class="z-10 text-center px-margin-desktop max-w-lg">
<div class="mb-stack-lg flex justify-center">
<span class="material-symbols-outlined text-[64px] text-secondary-container" data-icon="school">school</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-primary mb-stack-md">Skill Mitra</h1>
<p class="font-headline-lg text-headline-lg text-primary-fixed-dim">Learn Free. Earn Real.</p>
</div>
</div>
<!-- Right Side: Form Panel -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-margin-mobile lg:p-margin-desktop bg-surface relative">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_12px_24px_-4px_rgba(0,0,0,0.04)] p-8 relative z-10 border border-surface-variant">
<!-- Mobile Logo (Visible only on mobile) -->
<div class="lg:hidden text-center mb-stack-lg">
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="school">school</span>
<h2 class="font-headline-md text-headline-md text-primary mt-2">Skill Mitra</h2>
</div>
<!-- Form Header -->
<div class="mb-stack-lg text-center">
<h2 class="font-headline-lg-mobile lg:font-headline-lg text-headline-lg-mobile lg:text-headline-lg text-primary mb-2">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your details to sign in.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-stack-md" method="POST">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="email">Email</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200" id="email" name="email" placeholder="Enter your email" required="" type="email"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="password">Password</label>
<div class="relative">
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-label-md text-label-md text-on-surface-variant" for="remember-me">Remember me</label>
</div>
<div class="text-sm">
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
</div>
<div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-primary bg-secondary-container hover:bg-secondary-fixed-dim focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition-all duration-200 active:scale-[0.98]" type="submit">
                                Sign in
                            </button>
</div>
</form>
<!-- Divider -->
<div class="mt-stack-lg mb-stack-md">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-variant"></div>
</div>
<div class="relative flex justify-center font-label-sm text-label-sm">
<span class="px-2 bg-surface-container-lowest text-on-surface-variant">Or continue with</span>
</div>
</div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-4 mb-stack-lg">
<button class="flex justify-center items-center py-2.5 px-4 border border-outline-variant rounded-lg shadow-sm bg-surface-container-lowest font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors duration-200" type="button">
<!-- Placeholder icon for Google -->
<span class="material-symbols-outlined mr-2" data-icon="account_circle">account_circle</span>
                            Google
                        </button>
<button class="flex justify-center items-center py-2.5 px-4 border border-outline-variant rounded-lg shadow-sm bg-surface-container-lowest font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors duration-200" type="button">
<!-- Placeholder icon for LinkedIn -->
<span class="material-symbols-outlined mr-2" data-icon="work">work</span>
                            LinkedIn
                        </button>
</div>
<!-- Toggle to Sign Up -->
<p class="text-center font-body-md text-body-md text-on-surface-variant">
                        Don't have an account? 
                        <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors underline decoration-2 underline-offset-4" href="#">Sign up now</a>
</p>
</div>
</div>
</div>
</main>
</body></html>
